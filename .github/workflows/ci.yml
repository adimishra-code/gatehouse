name: gatehouse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check
        run: cargo check --manifest-path gatehouse/Cargo.toml --all-targets
      - name: Tests
        run: cargo test --manifest-path gatehouse/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path gatehouse/Cargo.toml -- -D warnings

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
        working-directory: console
      - name: Build
        run: npm run build
        working-directory: console
